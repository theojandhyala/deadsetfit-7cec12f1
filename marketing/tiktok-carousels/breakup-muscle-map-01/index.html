<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEADSET — breakup muscle map draft</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .slide { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    .slide-one {
      background: #101318 url('../../tiktok/video/viral-research-hero/qa/motivation-0.5.jpg') center center / cover no-repeat;
    }
    .slide-one::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.03), rgba(0,0,0,.18));
    }
    .hook, .payoff {
      position: absolute; z-index: 2; left: 7%; right: 7%;
      color: #fff; font-size: clamp(36px, 5.1vw, 68px); font-weight: 800;
      line-height: 1.03; text-align: center; letter-spacing: -.035em;
      text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 5px 16px rgba(0,0,0,.75);
    }
    .hook { top: 45%; transform: translateY(-50%); }
    .slide-two { background: #070708; color: #fff; padding: 66px 48px 54px; }
    .app-top { display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 37px; font-style: italic; font-weight: 950; letter-spacing: -.06em; }
    .brand span { color: #ee3326; }
    .draft-tag { color: #6d6d72; font-size: 14px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .screen-title { margin-top: 70px; }
    .eyebrow { color: #ed3b2e; font-size: 17px; font-weight: 850; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 10px 0 0; font-size: 49px; line-height: 1; letter-spacing: -.035em; }
    .period { color: #98989f; margin-top: 10px; font-size: 20px; font-weight: 700; }
    .card {
      position: relative; margin-top: 46px; padding: 38px 24px 68px;
      border: 1px solid #2b2b2e; border-radius: 26px;
      background: linear-gradient(145deg, #171719, #0f0f11);
      box-shadow: 0 26px 80px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.025);
    }
    .compare { display: grid; grid-template-columns: 1fr 74px 1fr; align-items: center; }
    .phase-title { margin-bottom: 16px; color: #eee; font-size: 23px; font-weight: 800; text-align: center; }
    .arrow { color: #ef3b2e; font-size: 74px; font-weight: 300; text-align: center; }
    .bodies { display: flex; justify-content: center; gap: 2px; }
    .body-svg { width: 118px; height: 278px; }
    .silhouette { fill: #1a1a1c; stroke: #4a4a4f; stroke-width: 1.2; }
    .muscle { fill: #242427; stroke: #38383c; stroke-width: .65; }
    .start .trained { fill: #702019; stroke: #a92b20; }
    .now .trained { fill: #ed382b; stroke: #ff6b5f; filter: drop-shadow(0 0 5px rgba(238,51,38,.42)); }
    .coverage { display: flex; justify-content: space-between; gap: 20px; margin-top: 25px; }
    .coverage div { flex: 1; }
    .coverage span { display: block; color: #7e7e84; font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .bar { height: 7px; margin-top: 9px; overflow: hidden; border-radius: 99px; background: #29292d; }
    .bar i { display: block; height: 100%; background: #ee382b; }
    .payoff { top: 72%; font-size: 52px; }
    .truth { position: absolute; left: 0; right: 0; bottom: 18px; color: #77777d; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-align: center; text-transform: uppercase; }
    .slide-two::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: #ed3528; }
  </style>
</head>
<body>
  <main id="slide" class="slide"></main>
  <script>
    const body = 'M100 30 q24 0 24 26 q0 22 -16 30 q22 6 28 28 l8 50 q-2 22 -18 34 l-10 18 v60 q8 30 -2 60 q-8 30 -8 60 v50 q4 22 -4 30 h-24 q-8 -8 -4 -30 v-50 q0 -30 -8 -60 q-10 -30 -2 -60 v-60 l-10 -18 q-16 -12 -18 -34 l8 -50 q6 -22 28 -28 q-16 -8 -16 -30 q0 -26 24 -26 z';
    const front = [
      ['M70 110 q30 -20 60 0 l-5 35 q-25 12 -50 0 z', 'trained'],
      ['M55 100 q10 -18 22 -6 l-4 24 q-10 6 -18 -2z', 'trained'],
      ['M145 100 q-10 -18 -22 -6 l4 24 q10 6 18 -2z', 'trained'],
      ['M44 130 q-8 25 0 50 q12 -4 14 -22 z', 'trained'],
      ['M156 130 q8 25 0 50 q-12 -4 -14 -22 z', 'trained'],
      ['M82 150 h36 v55 h-36 z', 'late'],
      ['M70 150 l8 0 v50 l-10 -6 z', 'late'],
      ['M130 150 l-8 0 v50 l10 -6 z', 'late'],
      ['M75 220 q12 -4 22 0 v80 l-18 -6 z', 'late'],
      ['M125 220 q-12 -4 -22 0 v80 l18 -6 z', 'late'],
      ['M82 320 q8 -2 14 0 v50 l-12 -4 z', 'late'],
      ['M118 320 q-8 -2 -14 0 v50 l12 -4 z', 'late'],
    ];
    const back = [
      ['M55 100 q10 -18 22 -6 l-4 24 q-10 6 -18 -2z', 'trained'],
      ['M145 100 q-10 -18 -22 -6 l4 24 q10 6 18 -2z', 'trained'],
      ['M44 130 q-8 25 0 50 q12 -4 14 -22 z', 'late'],
      ['M156 130 q8 25 0 50 q-12 -4 -14 -22 z', 'late'],
      ['M62 120 q-8 30 -2 60 l22 -4 v-58 z', 'late'],
      ['M138 120 q8 30 2 60 l-22 -4 v-58 z', 'late'],
      ['M70 110 h60 v80 h-60 z', 'late'],
      ['M75 210 q25 -6 50 0 l-4 40 q-22 8 -42 0 z', 'late'],
      ['M75 260 q12 -2 22 0 v70 l-18 -4 z', 'late'],
      ['M125 260 q-12 -2 -22 0 v70 l18 -4 z', 'late'],
      ['M82 320 q8 -2 14 0 v50 l-12 -4 z', 'late'],
      ['M118 320 q-8 -2 -14 0 v50 l12 -4 z', 'late'],
    ];
    function figure(paths, phase) {
      return `<svg class="body-svg ${phase}" viewBox="0 0 200 420" aria-hidden="true"><path class="silhouette" d="${body}"/>${paths.map(([d, when]) => `<path class="muscle ${when === 'trained' || phase === 'now' ? 'trained' : ''}" d="${d}"/>`).join('')}</svg>`;
    }
    const slide = new URLSearchParams(location.search).get('slide') || '1';
    document.getElementById('slide').outerHTML = slide === '1'
      ? `<main class="slide slide-one"><div class="hook">so the breakup really hurt?</div></main>`
      : `<main class="slide slide-two">
          <div class="app-top"><div class="brand">DEAD<span>SET</span></div><div class="draft-tag">training data</div></div>
          <section class="screen-title"><div class="eyebrow">Muscle map</div><h1>Your training coverage</h1><div class="period">12 months of logged sessions</div></section>
          <section class="card">
            <div class="compare">
              <div><div class="phase-title">Start</div><div class="bodies">${figure(front, 'start')}${figure(back, 'start')}</div></div>
              <div class="arrow">›</div>
              <div><div class="phase-title">Now</div><div class="bodies">${figure(front, 'now')}${figure(back, 'now')}</div></div>
            </div>
            <div class="coverage"><div><span>Upper only</span><div class="bar"><i style="width:34%"></i></div></div><div><span>Balanced split</span><div class="bar"><i style="width:92%"></i></div></div></div>
            <div class="truth">Based on the exercises and sets you logged</div>
          </section>
          <div class="payoff">the muscle map says yes.</div>
        </main>`;
  </script>
</body>
</html>
