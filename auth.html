<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090609" />
    <title>DEADSET — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --red: #f00606;
        --red-dark: #a90008;
        --cream: #f5f5f0;
        --muted: #8e8d96;
        --panel: #1b1c22;
        --black: #050505;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090609;
        color: var(--cream);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #090609 !important;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
      }

      button,
      input {
        font: inherit;
      }

      .page {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(26px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 8%, rgba(240, 6, 6, 0.22), transparent 48%),
          radial-gradient(circle at 50% 45%, rgba(240, 6, 6, 0.08), transparent 58%),
          linear-gradient(180deg, #15080b 0%, #070607 72%, #050505 100%);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.18;
        pointer-events: none;
        background:
          linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(ellipse at center, black 0%, transparent 68%);
      }

      .close {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        right: 13px;
        z-index: 10;
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 999px;
        background: rgba(31, 33, 39, 0.86);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 12px 30px rgba(0,0,0,0.28);
        color: #c9c8cf;
        cursor: pointer;
      }

      .close::before,
      .close::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 31px;
        height: 4px;
        border-radius: 999px;
        background: currentColor;
        transform-origin: center;
      }

      .close::before { transform: translate(-50%, -50%) rotate(45deg); }
      .close::after { transform: translate(-50%, -50%) rotate(-45deg); }

      main {
        position: relative;
        z-index: 1;
        width: min(100%, 480px);
        text-align: center;
      }

      .brand-row {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
      }

      .brand-mark {
        width: 4px;
        height: 33px;
        border-radius: 999px;
        background: var(--red);
        box-shadow: 0 0 14px rgba(240, 6, 6, 0.75);
      }

      .brand {
        margin: 0;
        font-family: Oswald, Impact, sans-serif;
        font-size: clamp(48px, 13.2vw, 68px);
        font-style: italic;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 0.92;
        color: #fff;
        text-shadow: 0 0 28px rgba(240, 6, 6, 0.22);
      }

      .brand span {
        color: var(--red);
      }

      .tagline {
        margin: 15px 0 52px;
        color: #a7a6b0;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }

      .card {
        width: 100%;
        margin: 0 auto;
        padding: 38px;
        border: 1px solid rgba(240, 6, 6, 0.18);
        border-radius: 26px;
        background: rgba(28, 29, 36, 0.97);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.025) inset,
          0 26px 90px rgba(0,0,0,0.55),
          0 0 48px rgba(240, 6, 6, 0.12);
        text-align: left;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        height: 60px;
        margin: 0 0 34px;
        padding: 4px;
        border-radius: 18px;
        background: #050505;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 4px 10px rgba(0,0,0,0.28);
      }

      .tab {
        min-height: 0;
        border: 0;
        border-radius: 15px;
        background: transparent;
        color: #7f7e8a;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.01em;
        transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
      }

      .tab.active {
        background: var(--red);
        color: white;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.15),
          0 0 0 1px rgba(255,255,255,0.05),
          0 8px 18px rgba(240,6,6,0.28);
      }

      label {
        display: block;
        margin: 0 0 10px;
        color: #9a99a3;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .field {
        margin-bottom: 19px;
      }

      .input-wrap {
        position: relative;
      }

      input {
        display: block;
        width: 100%;
        height: 62px;
        border: 1px solid rgba(255,255,255,0.055);
        border-radius: 18px;
        outline: none;
        background: #050505;
        color: #f5f5f0;
        caret-color: var(--red);
        padding: 0 22px;
        font-size: 17px;
        font-weight: 700;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
      }

      input::placeholder {
        color: #777680;
        font-weight: 700;
      }

      input:focus {
        border-color: rgba(240, 6, 6, 0.72);
        box-shadow: 0 0 0 1px rgba(240,6,6,0.45), 0 0 22px rgba(240,6,6,0.12);
      }

      #password {
        padding-right: 58px;
      }

      .eye {
        position: absolute;
        top: 50%;
        right: 14px;
        width: 40px;
        height: 40px;
        min-height: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #737280;
        transform: translateY(-50%);
        cursor: pointer;
      }

      .eye svg {
        display: block;
        width: 23px;
        height: 23px;
        margin: auto;
      }

      .forgot {
        display: block;
        width: max-content;
        margin: 7px 0 20px auto;
        border: 0;
        background: transparent;
        color: #92919b;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .submit {
        display: block;
        width: 100%;
        min-height: 64px;
        border: 0;
        border-radius: 18px;
        background: var(--red);
        color: white;
        cursor: pointer;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.18),
          0 0 0 1px rgba(255,255,255,0.04),
          0 12px 26px rgba(240, 6, 6, 0.32);
        transition: filter 0.15s ease, transform 0.05s ease;
      }

      .submit:hover {
        filter: brightness(1.06);
      }

      .submit:active {
        transform: translateY(1px);
      }

      .submit:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #message {
        min-height: 20px;
        margin: 16px 2px 0;
        color: #e9e9e3;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.45;
        text-align: center;
      }

      #message.error {
        color: #ff766e;
      }

      .legal {
        max-width: 410px;
        margin: 22px auto 0;
        color: #76757e;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.55;
        text-align: center;
      }

      .legal a {
        color: #bdbcC5;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      @media (max-width: 430px) {
        .page {
          align-items: flex-start;
          padding: 76px 27px 26px;
        }

        main {
          width: 100%;
        }

        .brand-row {
          margin-top: 14px;
          gap: 10px;
        }

        .brand-mark {
          height: 30px;
        }

        .tagline {
          margin-bottom: 48px;
          font-size: 13px;
          letter-spacing: 0.4em;
        }

        .card {
          padding: 35px 35px 28px;
          border-radius: 24px;
        }

        .tabs {
          height: 58px;
          margin-bottom: 32px;
        }

        input {
          height: 62px;
          border-radius: 18px;
        }

        .submit {
          min-height: 64px;
        }
      }

      @media (max-width: 370px) {
        .page {
          padding-inline: 18px;
        }

        .card {
          padding-inline: 22px;
        }

        .brand {
          font-size: 46px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <button class="close" type="button" aria-label="Close" id="close-auth"></button>
      <main>
        <div class="brand-row" aria-label="DEADSET">
          <span class="brand-mark" aria-hidden="true"></span>
          <p class="brand">DEAD<span>SET</span></p>
        </div>
        <p class="tagline">Forge Your Body</p>

        <section class="card" aria-label="Authentication">
          <div class="tabs" role="tablist" aria-label="Authentication mode">
            <button class="tab active" id="signin-tab" type="button" role="tab" aria-selected="true">Sign In</button>
            <button class="tab" id="signup-tab" type="button" role="tab" aria-selected="false">Create Account</button>
          </div>

          <form id="auth-form">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="your@email.com" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="input-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required />
                <button class="eye" id="toggle-password" type="button" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="2" />
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                  </svg>
                </button>
              </div>
            </div>
            <button class="forgot" id="forgot-password" type="button">Forgot password?</button>
            <button class="submit" id="submit" type="submit">Sign In</button>
          </form>
          <p id="message" role="status" aria-live="polite"></p>
        </section>

        <p class="legal">By continuing you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
      </main>
    </div>
    <script type="module" src="/src/auth-standalone.ts"></script>
  </body>
</html>
