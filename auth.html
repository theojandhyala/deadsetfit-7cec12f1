<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Redirect to the explicit static sign-in file. Target /auth/index.html,
         not the /auth/ directory: the Capacitor iOS bundled webview can't serve
         a directory index and loops on the SPA otherwise. -->
    <title>Join DEADSET</title>
    <script>
      const target = `/auth/index.html${window.location.search}${window.location.hash}`;
      window.location.replace(target);
    </script>
  </head>
  <body style="margin: 0; background: #080507; color: #f5f5f0; font-family: system-ui, sans-serif">
    <main
      style="
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      "
    >
      <div>
        <h1
          style="
            margin: 0;
            color: #fff;
            font-family: Oswald, Impact, &quot;Arial Black&quot;, sans-serif;
            font-size: clamp(48px, 13vw, 64px);
            font-style: italic;
            letter-spacing: -0.045em;
            line-height: 0.92;
            text-shadow: 0 0 36px rgba(230, 50, 34, 0.4);
          "
        >
          DEAD<span style="color: #f00606">SET</span>
        </h1>
        <p>Opening account setup…</p>
        <p>
          <a id="auth-fallback" href="/auth/index.html" style="color: #f00606"
            >Tap here if it does not open</a
          >
        </p>
      </div>
    </main>
    <script>
      document.getElementById("auth-fallback").href =
        `/auth/index.html${window.location.search}${window.location.hash}`;
    </script>
  </body>
</html>
