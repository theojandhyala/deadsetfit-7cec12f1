<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090609" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DEADSET — Sign In</title>
    <style>
      :root {
        color-scheme: dark;
        --red: #f00606;
        --cream: #f5f5f0;
        --muted: #93929c;
        --panel: #1c1d24;
        --black: #050505;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #080507;
        color: var(--cream);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body,
      .page,
      main,
      .card,
      form,
      .field {
        transform: none !important;
        animation: none !important;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #080507;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      button,
      input {
        font: inherit;
      }

      .page {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
        padding: max(72px, calc(env(safe-area-inset-top) + 52px)) 24px
          max(28px, calc(env(safe-area-inset-bottom) + 20px));
        background:
          radial-gradient(
            ellipse at 50% 5%,
            rgba(230, 50, 34, 0.2) 0%,
            rgba(230, 50, 34, 0.07) 34%,
            transparent 62%
          ),
          linear-gradient(180deg, #140609 0%, #080507 72%);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(ellipse at center, black 0%, transparent 68%);
      }

      .close {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 999px;
        background: rgba(37, 38, 45, 0.92);
        color: #c9c8cf;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.4);
      }

      .close::before,
      .close::after {
        content: "";
        position: absolute;
        width: 26px;
        height: 3px;
        border-radius: 999px;
        background: currentColor;
      }

      .close::before {
        transform: rotate(45deg);
      }
      .close::after {
        transform: rotate(-45deg);
      }

      main {
        position: relative;
        z-index: 1;
        width: min(100%, 476px);
        margin: 0 auto;
      }

      .brand-wrap {
        margin: 0 0 22px;
        text-align: center;
      }

      .brand-row {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .slash {
        width: 4px;
        height: 34px;
        border-radius: 999px;
        background: var(--red);
        box-shadow: 0 0 18px rgba(240, 6, 6, 0.8);
      }

      .brand {
        margin: 0;
        color: #fff;
        font-family: Oswald, Impact, "Arial Black", sans-serif;
        font-size: clamp(48px, 13vw, 64px);
        font-style: italic;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 0.92;
        text-shadow: 0 0 36px rgba(230, 50, 34, 0.34);
      }

      .brand span {
        color: var(--red);
      }

      .tagline {
        margin: 12px 0 0;
        color: #a7a6b0;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }

      .auth-hype {
        margin: 0 0 18px;
        padding: 18px;
        border: 1px solid rgba(240, 6, 6, 0.22);
        border-radius: 24px;
        background:
          radial-gradient(circle at 92% 0%, rgba(240, 6, 6, 0.22), transparent 34%),
          linear-gradient(145deg, rgba(31, 32, 39, 0.94), rgba(8, 8, 8, 0.96));
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.045);
      }

      .hype-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .hype-kicker,
      .mini-label {
        margin: 0;
        color: var(--red);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .hype-title {
        margin: 5px 0 0;
        color: #fff;
        font-family: Oswald, Impact, "Arial Black", sans-serif;
        font-size: 28px;
        font-style: italic;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 0.96;
        text-transform: uppercase;
      }

      .rank-token {
        min-width: 72px;
        padding: 10px 9px;
        border: 1px solid rgba(240, 6, 6, 0.35);
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.34);
        text-align: center;
      }

      .rank-token strong {
        display: block;
        color: #fff;
        font-family: Oswald, Impact, "Arial Black", sans-serif;
        font-size: 24px;
        line-height: 1;
      }

      .hype-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 16px;
      }

      .hype-stat {
        padding: 10px 8px;
        border: 1px solid rgba(255, 255, 255, 0.075);
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.3);
      }

      .hype-stat strong {
        display: block;
        color: #fff;
        font-family: Oswald, Impact, "Arial Black", sans-serif;
        font-size: 16px;
        letter-spacing: 0.04em;
      }

      .hype-stat span {
        display: block;
        margin-top: 2px;
        color: #858490;
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .rank-dots {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 7px;
        margin-top: 16px;
      }

      .rank-dot {
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .rank-dot.hot {
        background: var(--red);
        box-shadow: 0 0 14px rgba(240, 6, 6, 0.56);
        animation: dotPulse 2.2s ease-in-out infinite;
      }

      .rank-dot.hot:nth-child(2) {
        animation-delay: 180ms;
      }

      @keyframes dotPulse {
        0%,
        100% {
          opacity: 0.78;
          box-shadow: 0 0 8px rgba(240, 6, 6, 0.34);
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 18px rgba(240, 6, 6, 0.72);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rank-dot.hot {
          animation: none;
        }
      }

      .card {
        width: 100%;
        padding: 30px;
        border: 1px solid rgba(240, 6, 6, 0.18);
        border-radius: 26px;
        background: rgba(28, 29, 36, 0.97);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.025) inset,
          0 28px 90px rgba(0, 0, 0, 0.56),
          0 0 42px rgba(230, 50, 34, 0.1);
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 54px;
        margin-bottom: 24px;
        padding: 4px;
        border-radius: 18px;
        background: #050505;
      }

      .tab {
        border: 0;
        border-radius: 15px;
        background: transparent;
        color: #858490;
        font-size: 17px;
        font-weight: 800;
      }

      .tab.active {
        background: var(--red);
        color: #fff;
        box-shadow: 0 8px 20px rgba(230, 50, 34, 0.32);
      }

      label {
        display: block;
        margin: 0 0 10px;
        color: #9998a2;
        font-size: 16px;
        font-weight: 800;
      }

      input {
        position: relative;
        z-index: 10;
        display: block;
        width: 100%;
        height: 58px;
        border: 1px solid rgba(255, 255, 255, 0.055);
        border-radius: 18px;
        outline: none;
        background: #050505;
        color: var(--cream);
        caret-color: var(--red);
        padding: 0 22px;
        font-size: 17px;
        font-weight: 700;
        pointer-events: auto;
        user-select: text;
        -webkit-user-select: text;
        touch-action: manipulation;
        -webkit-appearance: none;
        appearance: none;
      }

      input::placeholder {
        color: #777680;
      }

      input:focus {
        border-color: rgba(240, 6, 6, 0.72);
        box-shadow:
          0 0 0 1px rgba(240, 6, 6, 0.45),
          0 0 22px rgba(240, 6, 6, 0.12);
      }

      .field {
        margin-bottom: 18px;
      }

      .pw-wrap {
        position: relative;
      }

      .pw-wrap input {
        padding-right: 56px;
      }

      .pw-toggle {
        position: absolute;
        top: 50%;
        right: 9px;
        transform: translateY(-50%);
        z-index: 11;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #92919b;
        cursor: pointer;
      }

      .pw-toggle svg {
        width: 22px;
        height: 22px;
      }

      .pw-toggle .eye-off {
        display: none;
      }

      .pw-toggle.showing .eye {
        display: none;
      }

      .pw-toggle.showing .eye-off {
        display: block;
      }

      .pw-hint {
        margin: 8px 2px 0;
        color: #777680;
        font-size: 12px;
        font-weight: 700;
        transition: color 0.15s ease;
      }

      .pw-hint.ok {
        color: #f5f5f0;
      }

      .free-note {
        margin: 12px 0 0;
        color: #777680;
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      .forgot {
        display: block;
        margin: 24px 0 0 auto;
        border: 0;
        background: transparent;
        color: #92919b;
        font-size: 14px;
        font-weight: 800;
      }

      .submit {
        width: 100%;
        height: 58px;
        margin-top: 18px;
        border: 0;
        border-radius: 18px;
        background: var(--red);
        color: white;
        font-size: 19px;
        font-weight: 800;
        box-shadow: 0 12px 28px rgba(230, 50, 34, 0.34);
      }

      .submit:disabled {
        opacity: 0.62;
      }

      .message {
        min-height: 20px;
        margin-top: 16px;
        color: #a7a6b0;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;
        text-align: center;
      }

      .message.error {
        color: #ff6b62;
      }

      .message.success {
        color: #f5f5f0;
        font-size: 14px;
      }

      .terms {
        max-width: 420px;
        margin: 24px auto 0;
        color: #777680;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.7;
        text-align: center;
      }

      .terms a {
        color: #bdbcc5;
        text-underline-offset: 4px;
      }

      @media (max-width: 380px) {
        .page {
          padding-left: 16px;
          padding-right: 16px;
        }
        .card {
          padding: 24px 18px;
          border-radius: 22px;
        }
        .tagline {
          letter-spacing: 0.32em;
        }
        .hype-title {
          font-size: 24px;
        }
        .auth-hype {
          padding: 15px;
        }
        .tab {
          font-size: 14px;
        }
        label {
          font-size: 14px;
        }
        input {
          height: 54px;
          font-size: 16px;
          border-radius: 16px;
        }
        .submit {
          height: 56px;
          font-size: 17px;
          border-radius: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <button class="close" id="close" type="button" aria-label="Close"></button>
      <main>
        <div class="brand-wrap">
          <div class="brand-row">
            <span class="slash"></span>
            <h1 class="brand">DEAD<span>SET</span></h1>
          </div>
          <p class="tagline">Forge Your Body</p>
        </div>

        <section class="auth-hype" aria-label="DEADSET intro">
          <div class="hype-top">
            <div>
              <p class="hype-kicker">Start ranked training</p>
              <h2 class="hype-title">
                Track PRs.<br />Earn grit.<br /><span style="color: var(--red)">Climb ranks.</span>
              </h2>
            </div>
            <div class="rank-token">
              <p class="mini-label">Rank</p>
              <strong>I</strong>
              <p class="mini-label" style="color: #b06b35; margin-top: 4px">Bronze</p>
            </div>
          </div>
          <div class="hype-grid">
            <div class="hype-stat"><strong>LIVE</strong><span>Logging</span></div>
            <div class="hype-stat"><strong>PRS</strong><span>Detected</span></div>
            <div class="hype-stat"><strong>RANKED</strong><span>Leagues</span></div>
          </div>
          <div class="rank-dots" aria-hidden="true">
            <span class="rank-dot hot"></span>
            <span class="rank-dot hot"></span>
            <span class="rank-dot"></span>
            <span class="rank-dot"></span>
            <span class="rank-dot"></span>
            <span class="rank-dot"></span>
            <span class="rank-dot"></span>
          </div>
        </section>

        <section class="card" aria-label="Authentication">
          <div class="tabs" role="tablist">
            <button class="tab active" id="signin-tab" type="button">Sign In</button>
            <button class="tab" id="signup-tab" type="button">Create Account</button>
          </div>

          <form id="auth-form" autocomplete="on">
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                placeholder="your@email.com"
                required
              />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="pw-wrap">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Password"
                  minlength="6"
                  required
                />
                <button
                  class="pw-toggle"
                  id="toggle-password"
                  type="button"
                  aria-label="Show password"
                >
                  <svg
                    class="eye"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="eye-off"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68" />
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 8 10 8a9.74 9.74 0 0 0 5.39-1.61" />
                    <line x1="2" x2="22" y1="2" y2="22" />
                  </svg>
                </button>
              </div>
              <p class="pw-hint" id="password-hint" hidden>At least 6 characters</p>
            </div>

            <button class="forgot" id="forgot" type="button">Forgot password?</button>
            <button class="submit" id="submit" type="submit">Sign In</button>
            <p class="free-note" id="free-note" hidden>Free to join — no card required.</p>
            <div class="message" id="message" role="status" aria-live="polite"></div>
          </form>
        </section>

        <p class="terms">
          By continuing you agree to our <a href="/terms">Terms</a> and
          <a href="/privacy">Privacy Policy</a>.
        </p>
      </main>
    </div>

    <script type="module" src="/src/auth/plain.ts"></script>
  </body>
</html>
