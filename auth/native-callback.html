<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Returning to DEADSET</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #090909;
        color: #f5f5f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: #090909;
      }
      main {
        width: min(100%, 360px);
        text-align: center;
      }
      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 24px;
        place-items: center;
        border: 1px solid #313131;
        border-radius: 14px;
        background: #151515;
        font-size: 22px;
        font-weight: 900;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }
      p {
        margin: 10px 0 24px;
        color: #a3a3a3;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        padding: 0 20px;
        background: #f5f5f5;
        color: #090909;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">D</div>
      <h1>Returning to DEADSET</h1>
      <p>Your sign-in is complete. The app should reopen automatically.</p>
      <a id="return-to-app" href="org.deadsetfit.app://auth/callback">Return to DEADSET</a>
    </main>
    <script>
      (() => {
        const callback = window.location.search + window.location.hash;
        const appUrl = `org.deadsetfit.app://auth/callback${callback}`;
        const returnButton = document.getElementById("return-to-app");

        returnButton.href = appUrl;
        window.history.replaceState({}, "", "/auth/native-callback");
        window.location.replace(appUrl);
      })();
    </script>
  </body>
</html>
