name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}

      - name: Check build output
        run: |
          echo "=== root ===" && ls -la | head -20
          echo "=== .output (if exists) ===" && ls -la .output 2>/dev/null || echo "no .output dir"
          echo "=== dist (if exists) ===" && ls -la dist 2>/dev/null || echo "no dist dir"

      - name: Create Pages project if needed
        run: npx wrangler pages project create deadsetfit --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: |
          if [ -d ".output/public" ]; then
            npx wrangler pages deploy .output/public --project-name=deadsetfit --commit-dirty=true
          elif [ -d "dist/client" ]; then
            npx wrangler pages deploy dist/client --project-name=deadsetfit --commit-dirty=true
          else
            echo "No output directory found!" && exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
