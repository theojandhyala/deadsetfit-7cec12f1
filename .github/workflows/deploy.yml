name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}

      - name: Bundle SSR worker
        run: |
          POLYFILL='if(typeof MessageChannel==="undefined"){var _MC=function(){this.port1={postMessage:function(){},close:function(){},onmessage:null};this.port2={postMessage:function(){},close:function(){},onmessage:null}};globalThis.MessageChannel=_MC;}'
          npx esbuild worker-entry.js \
            --bundle \
            --platform=browser \
            --target=esnext \
            --format=esm \
            --external:"node:*" \
            --define:process.env.NODE_ENV='"production"' \
            "--banner:js=${POLYFILL}" \
            --outfile=dist/client/_worker.js

      - name: Create Pages project if needed
        run: npx wrangler pages project create deadsetfit --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name=deadsetfit --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
