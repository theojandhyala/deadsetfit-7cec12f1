name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}

      - name: Create Cloudflare worker entry
        run: |
          cat > worker-entry.js << 'EOF'
          import server from './dist/server/server.js';
          export default {
            async fetch(request, env, ctx) {
              const url = new URL(request.url);
              const path = url.pathname;
              // Serve static assets via Cloudflare's asset store
              if (
                path.startsWith('/assets/') ||
                path === '/favicon.ico' ||
                path === '/manifest.json' ||
                path === '/robots.txt' ||
                path === '/sitemap.xml' ||
                path === '/llms.txt' ||
                /\.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp|avif)$/.test(path)
              ) {
                try { return await env.ASSETS.fetch(request); } catch {}
              }
              return server.fetch(request, env, ctx);
            }
          };
          EOF

      - name: Bundle SSR worker for Cloudflare Pages
        run: |
          npx esbuild worker-entry.js \
            --bundle \
            --outfile=dist/client/_worker.js \
            --platform=browser \
            --format=esm \
            --target=es2022 \
            --conditions=workerd,worker,browser \
            --external:node:* \
            --log-level=info

      - name: Create Pages project if needed
        run: npx wrangler pages project create deadsetfit --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name=deadsetfit --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
