name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Types, lint, unit tests, then the production build — in one step because
      # `check` ends in the same `vite build` the deploy uploads. Before this,
      # CI built without ever running a test, so a green deploy proved nothing.
      - name: Check and build
        run: bun run check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}

      # Refuses to deploy a front-end wired to the wrong backend. CI's build
      # secrets and the live Supabase project drifted apart once already; this
      # turns that into a failed run instead of a broken production app.
      - name: Verify bundle targets the expected backend
        run: node scripts/check-bundle-config.mjs

      # Cloudflare returns 10429 (rate limited) when several deploys land close
      # together, which failed a run whose build and tests had already passed.
      # Retry with backoff rather than leaving main built but not served. The
      # project is created on first use by `pages deploy`, so there is no
      # separate create step burning a call against the same limit.
      - name: Deploy to Cloudflare Pages
        run: |
          # Without pipefail the `if` below reads tee's exit status, not
          # wrangler's, and a failed deploy would report success.
          set -o pipefail
          mv wrangler.jsonc wrangler.jsonc.bak
          deployed=0
          for attempt in 1 2 3 4 5; do
            if npx wrangler pages deploy dist/client --project-name=deadsetfit --branch=main --commit-dirty=true 2>&1 | tee deploy.log; then
              deployed=1
              break
            fi
            # A dead or under-permissioned token fails identically five times in
            # a row; only throttling is worth waiting out. Retrying auth errors
            # just buries the real cause under fifteen minutes of backoff.
            if grep -qE "code: (9109|10000)" deploy.log; then
              echo "::error::Cloudflare rejected the API token (9109/10000). Replace the CLOUDFLARE_API_TOKEN secret — it is expired, revoked, or missing Pages:Edit. Not retrying."
              break
            fi
            wait=$((attempt * 60))
            echo "Pages deploy attempt $attempt failed (throttled); retrying in ${wait}s"
            sleep "$wait"
          done
          rm -f deploy.log
          mv wrangler.jsonc.bak wrangler.jsonc
          if [ "$deployed" -ne 1 ]; then
            echo "Pages deploy failed after 5 attempts"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The API worker (deadsetfit.org/api/* — rpc, Stripe webhook, health)
      # must deploy alongside the Pages site or /api/rpc serves stale code
      # (or the SPA's HTML), which kills checkout and every AI feature.
      - name: Deploy API worker
        run: |
          node -e "
            const { readFileSync, writeFileSync } = require('node:fs');
            const config = readFileSync('wrangler.jsonc', 'utf8')
              .replace(/\n\s*\"pages_build_output_dir\"\s*:\s*\"[^\"]+\",?/, '')
              // Strip routes: the custom-domain route already exists and binds by
              // worker name, so a script-only deploy updates it in place. This
              // avoids the /workers/routes API (needs a zone-level token perm)
              // and only uses Workers Scripts:Edit, which the token already has.
              .replace(/\n\s*\"routes\"\s*:\s*\[[\s\S]*?\],?/, '');
            writeFileSync('.wrangler.worker.tmp.jsonc', config);
          "
          npx wrangler deploy --config .wrangler.worker.tmp.jsonc
          rm -f .wrangler.worker.tmp.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
