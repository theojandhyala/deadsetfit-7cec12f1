name = "deadsetfit-7cec12f1"
main = "dist/server/server.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "bun run build"

[assets]
directory = "dist/client"
binding = "ASSETS"

routes = [
  { pattern = "deadsetfit.org/*", custom_domain = true },
  { pattern = "www.deadsetfit.org/*", custom_domain = true },
]

# Public (non-secret) runtime vars
[vars]
SUPABASE_URL = "https://upofuwryfvvtkhphtcop.supabase.co"

# Secret runtime vars — set these via Cloudflare dashboard → Workers → Settings → Variables:
#   SUPABASE_SERVICE_ROLE_KEY   (from Supabase dashboard → Settings → API)
#   OPENAI_API_KEY              (from platform.openai.com → API keys)
#   STRIPE_SECRET_KEY           (from Stripe dashboard → Developers → API keys)
#   STRIPE_WEBHOOK_SECRET       (from Stripe dashboard → Webhooks)
