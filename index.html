<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>DEADSET</title>
    <meta
      name="description"
      content="Download DEADSET for iPhone. Plan your training, log every set, catch every PR, track nutrition and recovery, and climb the ranks."
    />
    <meta property="og:title" content="DEADSET — Train Like It Counts" />
    <meta
      property="og:description"
      content="The iPhone gym app for planning workouts, logging sets, tracking progress, nutrition, recovery and ranked leagues."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deadsetfit.org" />
    <!-- Without an og:image, Safari/iMessage/WhatsApp fall back to the 180px
         touch icon, which unfurls as a tiny logo lost in a dark tile. This card
         is generated from the same vectors as the app icon
         (scripts/generate-og-image.mjs) so the two cannot drift apart. -->
    <meta property="og:image" content="https://deadsetfit.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DEADSET — log every set, catch every PR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://deadsetfit.org/og-image.png" />
    <meta name="twitter:title" content="DEADSET — Train Like It Counts" />
    <meta
      name="twitter:description"
      content="Plan every session, log every set, catch every PR and see exactly what is improving. Download on the App Store."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Boot screen. Inline on purpose: it must paint before any stylesheet,
         webfont or module has loaded, since those are exactly what can fail.
         The wordmark is set in system-ui rather than a webfont for the same
         reason — no request, no dependency, and it renders identically whether
         or not Inter has arrived. An earlier version asked for Impact, which
         iOS does not ship; the stack below ends in the platform sans, so there
         is always a real face to fall back to. */
      html,
      body,
      #root {
        min-height: 100%;
        background: #080808;
      }
      body {
        margin: 0;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        background:
          radial-gradient(60% 42% at 50% 46%, rgba(225, 6, 0, 0.12), transparent 72%),
          radial-gradient(120% 90% at 50% 0%, #180a0a 0%, #080808 55%);
        color: #f5f5f0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
        opacity: 1;
        transform: scale(1);
        transition:
          opacity 0.42s ease,
          transform 0.42s cubic-bezier(0.4, 0, 1, 1),
          visibility 0s linear 0.42s;
      }
      .boot::before {
        content: "";
        position: absolute;
        inset: -20%;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        background-size: 34px 34px;
        transform: perspective(500px) rotateX(62deg) translateY(24%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 8%, black 52%, transparent 88%);
        mask-image: linear-gradient(to bottom, transparent 8%, black 52%, transparent 88%);
        pointer-events: none;
      }
      .boot::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -16vh;
        width: min(88vw, 430px);
        aspect-ratio: 1;
        border: 1px solid rgba(225, 6, 0, 0.14);
        border-radius: 50%;
        box-shadow:
          0 0 0 34px rgba(225, 6, 0, 0.025),
          0 0 0 68px rgba(225, 6, 0, 0.018);
        transform: translateX(-50%);
        pointer-events: none;
      }
      .boot--finished {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(1.018);
      }
      .boot-shell {
        position: relative;
        z-index: 1;
        width: min(100%, 360px);
      }
      /* This is the exact published App Store artwork from AppIcon.appiconset.
         Do not recreate the official wordmark with approximate live type. */
      .boot-logo {
        display: block;
        width: min(72vw, 264px);
        height: auto;
        margin: 0 auto;
        object-fit: contain;
        opacity: 0;
        filter: drop-shadow(0 18px 38px rgba(225, 6, 0, 0.18));
        animation:
          boot-rise 0.62s cubic-bezier(0.16, 0.84, 0.44, 1) 0.08s forwards,
          boot-breathe 2.8s ease-in-out 0.9s infinite;
      }
      .boot-logo-frame {
        position: relative;
        display: grid;
        min-height: 182px;
        place-items: center;
        overflow: hidden;
      }
      .boot-logo-frame::after {
        content: "";
        position: absolute;
        width: 196px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(225, 6, 0, 0.82), transparent);
        transform: translateY(54px) scaleX(0.2);
        opacity: 0;
        animation: boot-logo-line 0.65s ease-out 0.48s forwards;
      }
      @keyframes boot-logo-line {
        to {
          opacity: 1;
          transform: translateY(54px) scaleX(1);
        }
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(7px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .boot-track {
        width: 156px;
        height: 2px;
        margin: 30px auto 0;
        overflow: hidden;
        border-radius: 2px;
        background: #262626;
      }
      .boot-bar {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #e10600 40%, #ff4b45);
        animation: boot-sweep 1.25s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .boot-label {
        margin: 0;
        color: #8a8a8a;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      .boot-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 24px;
        margin-top: 14px;
      }
      .boot-status-dot {
        width: 5px;
        height: 5px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #e10600;
        box-shadow: 0 0 12px rgba(225, 6, 0, 0.8);
        animation: boot-dot 1.25s ease-in-out infinite;
      }
      .boot-retry {
        display: none;
        min-height: 44px;
        margin: 18px auto 0;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: #f5f5f0;
        padding: 0 20px;
        font: inherit;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .boot--stalled .boot-retry {
        display: block;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 0 rgba(225, 6, 0, 0));
        }
        50% {
          transform: scale(1.022);
          filter: drop-shadow(0 6px 26px rgba(225, 6, 0, 0.34));
        }
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-140%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @keyframes boot-dot {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      /* Respect a stated preference for stillness: motion sickness and
         vestibular disorders are not edge cases. */
      @media (prefers-reduced-motion: reduce) {
        .boot-logo,
        .boot-logo-frame::after,
        .boot-bar,
        .boot-status-dot {
          animation: none;
        }
        /* Without the entrance animation these would stay at opacity 0 and the
           logo would never appear at all. */
        .boot-logo,
        .boot-logo-frame::after {
          opacity: 1;
          transform: none;
        }
        .boot-bar {
          width: 100%;
        }
      }
    </style>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          document.documentElement.dataset.deadsetModuleError =
            [event.message, event.filename, event.lineno].filter(Boolean).join(" · ") ||
            "Unknown module error";
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <main id="deadset-boot-screen" class="boot" role="status" aria-live="polite">
      <div class="boot-shell">
        <div class="boot-logo-frame">
          <img
            class="boot-logo"
            src="/icon-512.png"
            alt="DEADSET — Forge your body"
            width="512"
            height="512"
            fetchpriority="high"
          />
        </div>
        <div class="boot-track"><div class="boot-bar"></div></div>
        <div class="boot-status">
          <span class="boot-status-dot" aria-hidden="true"></span>
          <p id="deadset-boot-label" class="boot-label">Preparing your training</p>
        </div>
        <button class="boot-retry" type="button" onclick="window.location.reload()">
          Retry safely
        </button>
      </div>
    </main>
    <script>
      // Progress messaging never dismisses the launch layer. It only explains
      // a slow account restore and offers recovery if readiness never arrives.
      (function () {
        var screen = document.getElementById("deadset-boot-screen");
        var label = document.getElementById("deadset-boot-label");
        setTimeout(function () {
          if (screen && screen.isConnected && label) label.textContent = "Syncing your training";
        }, 3200);
        setTimeout(function () {
          if (!screen || !screen.isConnected || !label) return;
          screen.classList.add("boot--stalled");
          label.textContent = "Still getting things ready";
        }, 11000);
      })();
    </script>
    <script>
      // Boot watchdog: if the entry module or the app stylesheet never load
      // (e.g. a poisoned immutable cache entry after a deploy), re-fetch them
      // with a cache-busting query so the browser gets a fresh copy. Without
      // this, one bad response mid-deploy leaves a device broken for a year.
      (function () {
        var RETRY_KEY = "deadset_boot_retry_v5";
        var CSS_KEY = "deadset_css_retry_v1";
        function showBootFailure(error) {
          try {
            document.documentElement.dataset.deadsetBootError =
              error && error.message
                ? error.message
                : String(error || "entry module did not execute");
            console.error("DEADSET boot watchdog", error);
          } catch (e) {
            /* diagnostic only */
          }
          var root =
            document.getElementById("deadset-boot-screen") || document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<main style="min-height:100vh;display:grid;place-items:center;background:#0a0a0a;color:#f5f5f0;font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center">' +
            '<div style="max-width:360px">' +
            '<h1 style="margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;font-size:40px;font-weight:900;font-style:italic;letter-spacing:-.03em">DEAD<span style="color:#E10600">SET</span></h1>' +
            '<p style="margin:18px 0 0;font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Loading hit a snag</p>' +
            '<p style="margin:10px 0 22px;color:#8a8a8a;font-size:13px;line-height:1.5">Your account data is safe. Reload the app to pull the latest version.</p>' +
            '<button onclick="window.location.reload()" style="appearance:none;border:0;background:#E10600;color:white;padding:14px 22px;font-weight:900;letter-spacing:.12em;text-transform:uppercase">Reload DEADSET</button>' +
            "</div></main>";
        }
        function healCss() {
          try {
            var link = document.querySelector('link[rel="stylesheet"][href*="/assets/"]');
            if (!link) return;
            var healthy = false;
            for (var i = 0; i < document.styleSheets.length; i++) {
              var sheet = document.styleSheets[i];
              if (sheet.href && sheet.href.indexOf("/assets/") !== -1) {
                try {
                  healthy = !!(sheet.cssRules && sheet.cssRules.length > 50);
                } catch (e) {
                  healthy = false; // same-origin sheet unreadable = poisoned response
                }
              }
            }
            if (healthy || sessionStorage.getItem(CSS_KEY)) return;
            sessionStorage.setItem(CSS_KEY, "1");
            var fresh = document.createElement("link");
            fresh.rel = "stylesheet";
            fresh.href = link.href.split("?")[0] + "?boot=" + Date.now();
            document.head.appendChild(fresh);
          } catch (e) {
            /* best effort */
          }
        }
        window.addEventListener("load", function () {
          setTimeout(function () {
            healCss();
            if (window.__DEADSET_BOOT_OK) return;
            var entry = document.querySelector('script[type="module"][src]');
            if (!entry || sessionStorage.getItem(RETRY_KEY)) {
              showBootFailure(new Error("Entry module did not execute after retry"));
              return;
            }
            sessionStorage.setItem(RETRY_KEY, "1");
            import(entry.src + "?boot=" + Date.now()).catch(showBootFailure);
          }, 2000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
