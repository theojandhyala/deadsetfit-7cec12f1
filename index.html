<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DEADSET</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#0a0a0a;color:#f5f5f0;font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center">
        <div>
          <h1 style="margin:0;font-family:Impact,'Arial Black',sans-serif;font-size:48px;font-style:italic;letter-spacing:-.04em">
            DEAD<span style="color:#E10600">SET</span>
          </h1>
          <p style="margin:14px 0 0;color:#8a8a8a;font-size:12px;font-weight:800;letter-spacing:.28em;text-transform:uppercase">
            Loading your training
          </p>
        </div>
      </main>
    </div>
    <script>
      // Boot watchdog: if the entry module never executes (e.g. a poisoned
      // immutable cache entry after a deploy), re-import it with a
      // cache-busting query so the browser fetches a fresh copy.
      (function () {
        var RETRY_KEY = "deadset_boot_retry_v2";
        function showBootFailure() {
          var root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<main style="min-height:100vh;display:grid;place-items:center;background:#0a0a0a;color:#f5f5f0;font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center">' +
            '<div style="max-width:360px">' +
            '<h1 style="margin:0;font-family:Impact,\'Arial Black\',sans-serif;font-size:44px;font-style:italic;letter-spacing:-.04em">DEAD<span style="color:#E10600">SET</span></h1>' +
            '<p style="margin:18px 0 0;font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Loading hit a snag</p>' +
            '<p style="margin:10px 0 22px;color:#8a8a8a;font-size:13px;line-height:1.5">Your account data is safe. Reload the app to pull the latest version.</p>' +
            '<button onclick="window.location.reload()" style="appearance:none;border:0;background:#E10600;color:white;padding:14px 22px;font-weight:900;letter-spacing:.12em;text-transform:uppercase">Reload DEADSET</button>' +
            "</div></main>";
        }
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (window.__DEADSET_BOOT_OK) return;
            var entry = document.querySelector('script[type="module"][src]');
            if (!entry || sessionStorage.getItem(RETRY_KEY)) {
              showBootFailure();
              return;
            }
            sessionStorage.setItem(RETRY_KEY, "1");
            import(entry.src + "?boot=" + Date.now()).catch(showBootFailure);
          }, 2000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
