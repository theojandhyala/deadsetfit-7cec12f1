<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>DEADSET</title>
    <meta
      name="description"
      content="DEADSET — the training system for lifters. Live set logging, automatic PR detection, streak armor, ranked leagues, strength standards and recovery tracking. Start free."
    />
    <meta
      property="og:title"
      content="DEADSET — Train Smarter. Track Everything. Forge Your Body."
    />
    <meta
      property="og:description"
      content="Live set logging, automatic PR detection, streak armor, ranked leagues and strength analytics. Built for the lift, not the feed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deadsetfit.org" />
    <!-- Without an og:image, Safari/iMessage/WhatsApp fall back to the 180px
         touch icon, which unfurls as a tiny logo lost in a dark tile. This card
         is generated from the same vectors as the app icon
         (scripts/generate-og-image.mjs) so the two cannot drift apart. -->
    <meta property="og:image" content="https://deadsetfit.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DEADSET — log every set, catch every PR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://deadsetfit.org/og-image.png" />
    <meta name="twitter:title" content="DEADSET — Train Smarter. Track Everything." />
    <meta
      name="twitter:description"
      content="Live set logging, automatic PR detection, streak armor and ranked leagues. Start free."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Boot screen. Inline on purpose: it must paint before any stylesheet,
         webfont or module has loaded, since those are exactly what can fail.
         The wordmark is set in system-ui rather than a webfont for the same
         reason — no request, no dependency, and it renders identically whether
         or not Inter has arrived. An earlier version asked for Impact, which
         iOS does not ship; the stack below ends in the platform sans, so there
         is always a real face to fall back to. */
      .boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #1a0b0b 0%, #0a0a0a 55%);
        color: #f5f5f0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        padding: 24px;
        text-align: center;
      }
      /* The wordmark is drawn as live text rather than a bitmap: it stays sharp
         on every display, animates per-half, and costs no image bytes on the
         critical path. */
      .boot-mark {
        display: block;
        margin: 0 auto;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(38px, 13vw, 62px);
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.03em;
        line-height: 1;
        white-space: nowrap;
        animation: boot-breathe 2.8s ease-in-out 0.9s infinite;
      }
      .boot-mark span {
        display: inline-block;
        opacity: 0;
        animation: boot-slide 0.62s cubic-bezier(0.16, 0.84, 0.44, 1) forwards;
      }
      .boot-dead {
        color: #f5f5f0;
        transform: translateX(-26px);
      }
      .boot-set {
        color: #e10600;
        transform: translateX(26px);
        animation-delay: 0.1s;
      }
      .boot-tagline {
        margin: 14px 0 0;
        /* #6a6a6a sat at 3.66:1 on this background — under the 4.5:1 WCAG asks
           for at this size. #8a8a8a reads as the same quiet grey at 5.73:1. */
        color: #8a8a8a;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        text-indent: 0.42em;
        opacity: 0;
        animation: boot-rise 0.6s ease-out 0.44s forwards;
      }
      @keyframes boot-slide {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .boot-track {
        width: 132px;
        height: 2px;
        margin: 26px auto 0;
        overflow: hidden;
        border-radius: 2px;
        background: #262626;
      }
      .boot-bar {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #e10600 40%, #ff4b45);
        animation: boot-sweep 1.25s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .boot-label {
        margin: 16px 0 0;
        color: #8a8a8a;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 0 rgba(225, 6, 0, 0));
        }
        50% {
          transform: scale(1.022);
          filter: drop-shadow(0 6px 26px rgba(225, 6, 0, 0.34));
        }
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-140%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      /* Respect a stated preference for stillness: motion sickness and
         vestibular disorders are not edge cases. */
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-mark span,
        .boot-tagline,
        .boot-bar {
          animation: none;
        }
        /* Without the entrance animation these would stay at opacity 0 and the
           logo would never appear at all. */
        .boot-mark span,
        .boot-tagline {
          opacity: 1;
          transform: none;
        }
        .boot-bar {
          width: 100%;
        }
      }
    </style>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          document.documentElement.dataset.deadsetModuleError =
            [event.message, event.filename, event.lineno].filter(Boolean).join(" · ") ||
            "Unknown module error";
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root">
      <main class="boot">
        <div>
          <div class="boot-mark" role="img" aria-label="DEADSET">
            <span class="boot-dead">DEAD</span><span class="boot-set">SET</span>
          </div>
          <p class="boot-tagline">Forge your body</p>
          <div class="boot-track"><div class="boot-bar"></div></div>
          <p class="boot-label">Loading your training</p>
        </div>
      </main>
    </div>
    <script>
      // Boot watchdog: if the entry module or the app stylesheet never load
      // (e.g. a poisoned immutable cache entry after a deploy), re-fetch them
      // with a cache-busting query so the browser gets a fresh copy. Without
      // this, one bad response mid-deploy leaves a device broken for a year.
      (function () {
        var RETRY_KEY = "deadset_boot_retry_v5";
        var CSS_KEY = "deadset_css_retry_v1";
        function showBootFailure(error) {
          try {
            document.documentElement.dataset.deadsetBootError =
              error && error.message
                ? error.message
                : String(error || "entry module did not execute");
            console.error("DEADSET boot watchdog", error);
          } catch (e) {
            /* diagnostic only */
          }
          var root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<main style="min-height:100vh;display:grid;place-items:center;background:#0a0a0a;color:#f5f5f0;font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center">' +
            '<div style="max-width:360px">' +
            '<h1 style="margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;font-size:40px;font-weight:900;font-style:italic;letter-spacing:-.03em">DEAD<span style="color:#E10600">SET</span></h1>' +
            '<p style="margin:18px 0 0;font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Loading hit a snag</p>' +
            '<p style="margin:10px 0 22px;color:#8a8a8a;font-size:13px;line-height:1.5">Your account data is safe. Reload the app to pull the latest version.</p>' +
            '<button onclick="window.location.reload()" style="appearance:none;border:0;background:#E10600;color:white;padding:14px 22px;font-weight:900;letter-spacing:.12em;text-transform:uppercase">Reload DEADSET</button>' +
            "</div></main>";
        }
        function healCss() {
          try {
            var link = document.querySelector('link[rel="stylesheet"][href*="/assets/"]');
            if (!link) return;
            var healthy = false;
            for (var i = 0; i < document.styleSheets.length; i++) {
              var sheet = document.styleSheets[i];
              if (sheet.href && sheet.href.indexOf("/assets/") !== -1) {
                try {
                  healthy = !!(sheet.cssRules && sheet.cssRules.length > 50);
                } catch (e) {
                  healthy = false; // same-origin sheet unreadable = poisoned response
                }
              }
            }
            if (healthy || sessionStorage.getItem(CSS_KEY)) return;
            sessionStorage.setItem(CSS_KEY, "1");
            var fresh = document.createElement("link");
            fresh.rel = "stylesheet";
            fresh.href = link.href.split("?")[0] + "?boot=" + Date.now();
            document.head.appendChild(fresh);
          } catch (e) {
            /* best effort */
          }
        }
        window.addEventListener("load", function () {
          setTimeout(function () {
            healCss();
            if (window.__DEADSET_BOOT_OK) return;
            var entry = document.querySelector('script[type="module"][src]');
            if (!entry || sessionStorage.getItem(RETRY_KEY)) {
              showBootFailure(new Error("Entry module did not execute after retry"));
              return;
            }
            sessionStorage.setItem(RETRY_KEY, "1");
            import(entry.src + "?boot=" + Date.now()).catch(showBootFailure);
          }, 2000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
